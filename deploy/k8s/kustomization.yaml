# Apply everything with: kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todo
labels:
  - pairs:
      app.kubernetes.io/part-of: todo-service
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - api-deployment.yaml
  - api-service.yaml
# Credentials come from postgres.env, which is gitignored so no password is ever committed.
# `make k8s-secret` creates it with a random password (template: postgres.env.example).
# The generated name carries a content hash, so changing credentials rolls the pods.
secretGenerator:
  - name: postgres-credentials
    envs:
      - postgres.env
