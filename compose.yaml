# Local stack: `docker compose up` starts the API and the same PostgreSQL as the cluster (SPEC D6).
name: todo-service

services:
  api:
    build: .
    image: todo-api:dev
    environment:
      # Same credentials as the postgres service below; "postgres" is its hostname on the compose network.
      DATABASE_URL: postgres://${POSTGRES_USER:-todo}:${POSTGRES_PASSWORD:-todo}@postgres:5432/${POSTGRES_DB:-todo}?sslmode=disable
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      # Not strictly needed (the API retries until the database is up), but it keeps startup logs clean.
      postgres:
        condition: service_healthy
    # Docker's default 10s would SIGKILL mid-shutdown: drain (5s) + shutdown timeout (15s) need more.
    stop_grace_period: 25s

  postgres:
    # Pinned major+minor so every dev machine and CI run the same server version.
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo}
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      # Local-only default; real credentials come from a Kubernetes Secret (SPEC D1).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
    ports:
      # Bound to loopback so the dev database is never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `--wait` in `make db-up` blocks on this, so callers get a database that accepts connections.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
