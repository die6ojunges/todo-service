# Same gates as `make ci`, on every push and PR.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci
      # Catches a broken Dockerfile on every push; kept out of `make ci` so pre-commit stays fast.
      - run: docker build -t todo-api:ci .
      # Manifests must render; the real postgres.env is gitignored, so render with the example.
      - run: cp deploy/k8s/postgres.env.example deploy/k8s/postgres.env && kubectl kustomize deploy/k8s > /dev/null
